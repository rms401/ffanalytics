[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ffanalytics"
version = "3.1.17"
description = "Scrape data for fantasy football - Python port of the ffanalytics R package"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "requests>=2.28",
    "lxml>=4.9",
    "cssselect>=1.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/FantasyFootballAnalytics/ffanalytics"
Issues = "https://github.com/FantasyFootballAnalytics/ffanalytics/issues"

[tool.setuptools.packages.find]
include = ["ffanalytics*"]

[tool.pytest.ini_options]
markers = [
    "network: test performs live network requests (deselect with '-m \"not network\"')",
]
