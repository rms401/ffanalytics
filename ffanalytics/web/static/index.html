<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ffanalytics draft board</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div id="league">
    <span id="league-name">loading&hellip;</span>
    <span id="league-detail" class="dim"></span>
  </div>
  <div id="controls">
    <input id="search" type="search" placeholder="find player&hellip;" autocomplete="off">
    <nav id="pos-chips" aria-label="position filter"></nav>
    <label id="hide-drafted-wrap">
      <input id="hide-drafted" type="checkbox"> hide drafted
    </label>
    <button id="teams-btn" class="chip" type="button">teams</button>
  </div>
  <div id="freshness" class="dim">&mdash;</div>
</header>

<main id="content">
  <section id="board-wrap">
    <table id="board">
      <thead><tr id="board-head"></tr></thead>
      <tbody id="board-body"></tbody>
    </table>
  </section>
</main>

<footer id="bottom">
  <section id="advisor">
    <div id="advisor-head">advisor <span id="advisor-status" class="dim"></span></div>
    <div id="advisor-body" class="dim">pick your team to see the plan</div>
  </section>
  <section id="inspector">
    <div id="inspector-head">selected player
      <button id="inspector-close" aria-label="clear" hidden>&times;</button>
    </div>
    <div id="inspector-body" class="dim">click a player</div>
  </section>
  <section id="roster">
    <div id="roster-head">
      <label for="me">my team</label>
      <select id="me"><option value="">&mdash; pick your team &mdash;</option></select>
    </div>
    <div id="roster-slots"></div>
  </section>
  <section id="ticker">
    <div id="ticker-head">latest picks</div>
    <ol id="ticker-list"></ol>
  </section>
</footer>

<aside id="teams-panel" aria-label="team standings">
  <div id="teams-head">projected starter points
    <button id="teams-close" aria-label="close">&times;</button>
  </div>
  <ol id="teams-list"></ol>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
